<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Signing in | Beacon Bot</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body style="display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0b0f17;color:#e8edf7;font-family:system-ui,sans-serif">
  <div style="text-align:center;max-width:28rem;padding:2rem">
    <h1 style="font-size:1.25rem;margin-bottom:.5rem">Signing you in…</h1>
    <p id="status">Connecting your Discord account to Beacon Bot.</p>
  </div>
  <script src="/discord-config.js"></script>
  <script>
    (async () => {
      const params = new URLSearchParams(location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const apiBase = (window.DISCORD_PORTAL_CONFIG?.apiBaseUrl || '').replace(/\/$/, '');
      const siteUrl = (window.DISCORD_PORTAL_CONFIG?.siteUrl || 'https://beaconbot.site').replace(/\/$/, '');
      const status = document.getElementById('status');

      if (error || !code || !state) {
        status.textContent = 'Discord sign-in was cancelled or failed.';
        return;
      }

      try {
        const response = await fetch(`${apiBase}/auth/exchange`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ code, state })
        });
        if (!response.ok) throw new Error('Exchange failed');
        location.replace(`${siteUrl}/`);
      } catch {
        status.textContent = 'Could not complete sign-in. Make sure the bot API is running at api.beaconbot.site.';
      }
    })();
  </script>
</body>
</html>
