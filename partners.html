<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Beacon Bot | Partners</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <style>
    :root {
      --bg:#030711;
      --card:rgba(10,20,34,.72);
      --line:rgba(120,190,255,.13);
      --blue:#00b4d8;
      --cyan:#48cae4;
      --white:#f5fbff;
      --muted:#8293a8;
    }

    * {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body {
      font-family:Inter,Arial,sans-serif;
      background:var(--bg);
      color:var(--white);
      min-height:100vh;
    }

    body:before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background:
        radial-gradient(circle at 15% 10%,rgba(0,180,216,.12),transparent 30%),
        radial-gradient(circle at 85% 25%,rgba(72,202,228,.08),transparent 28%),
        linear-gradient(#ffffff03 1px,transparent 1px),
        linear-gradient(90deg,#ffffff03 1px,transparent 1px);
      background-size:auto,auto,55px 55px,55px 55px;
      z-index:-1;
    }

    a {
      text-decoration:none;
      color:inherit;
    }

    .nav {
      height:76px;
      position:fixed;
      top:0;
      left:0;
      right:0;
      z-index:20;
      border-bottom:1px solid var(--line);
      background:rgba(3,7,17,.88);
      backdrop-filter:blur(18px);
    }

    .navin {
      height:100%;
      max-width:1240px;
      margin:auto;
      padding:0 24px;
      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo {
      display:flex;
      align-items:center;
      gap:10px;
      font-weight:900;
      letter-spacing:1px;
    }

    .logo-mark {
      width:38px;
      height:38px;
      border-radius:11px;
      display:grid;
      place-items:center;
      background:linear-gradient(135deg,var(--blue),#0077b6);
      box-shadow:0 0 28px rgba(0,180,216,.28);
    }

    .links {
      display:flex;
      gap:7px;
    }

    .links a {
      padding:9px 13px;
      color:#a9b8c9;
      font-size:13px;
      border-radius:8px;
    }

    .links a:hover {
      color:#fff;
      background:#ffffff07;
    }

    .navbtn {
      background:linear-gradient(100deg,var(--blue),#0077b6);
      padding:11px 16px;
      border-radius:9px;
      font-size:12px;
      font-weight:800;
    }

    .page-header {
      padding:160px 24px 70px;
      text-align:center;
    }

    .eyebrow {
      font-size:10px;
      color:var(--cyan);
      font-weight:800;
      letter-spacing:2px;
    }

    .page-header h1 {
      font-size:clamp(42px,6vw,70px);
      margin:12px 0 16px;
      letter-spacing:-3px;
      background:linear-gradient(110deg,#fff,#ccefff 45%,var(--cyan));
      -webkit-background-clip:text;
      color:transparent;
    }

    .page-header p {
      max-width:650px;
      margin:auto;
      color:var(--muted);
      line-height:1.7;
    }

    .partners-grid {
      max-width:1180px;
      margin:auto;
      padding:20px 24px 110px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:18px;
    }

    .partner-card {
      padding:30px;
      border:1px solid var(--line);
      background:var(--card);
      backdrop-filter:blur(15px);
      border-radius:16px;
      text-align:center;
      transition:.25s;
    }

    .partner-card:hover {
      transform:translateY(-6px);
      border-color:#00b4d838;
    }

    .partner-card img {
      width:100px;
      height:100px;
      border-radius:50%;
      object-fit:cover;
      border:2px solid var(--line);
      margin-bottom:18px;
    }

    .partner-card h3 {
      font-size:17px;
      margin-bottom:8px;
    }

    .verified {
      color:var(--white);
    }

    .verified i {
      color:var(--cyan);
      margin-right:5px;
    }

    .partner-card p {
      color:var(--muted);
      font-size:12px;
      line-height:1.7;
      margin-bottom:22px;
    }

    .partner-card a:not(.logo) {
      display:inline-block;
      padding:10px 15px;
      margin:4px;
      border-radius:9px;
      background:linear-gradient(100deg,var(--blue),#0077b6);
      font-size:11px;
      font-weight:800;
    }

    footer {
      border-top:1px solid var(--line);
      padding:30px 24px;
      color:#607389;
      font-size:11px;
      text-align:center;
    }

    @media(max-width:850px) {
      .links {
        display:none;
      }

      .navbtn {
        display:none;
      }

      .partners-grid {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<nav class="nav">
  <div class="navin">

    <a class="logo" href="/">
      <span class="logo-mark">B</span>
      <span>BEACON</span>
    </a>

    <div class="links">
      <a href="index.html">Home</a>
      <a href="commands.html">Commands</a>
      <a href="index.html#dashboard">Dashboard</a>
      <a href="partners.html">Partners</a>
      <a href="team.html">Team</a>
    </div>

    <a class="navbtn"
       href="https://discord.com/oauth2/authorize?client_id=1426142433111965776&permissions=8&integration_type=0&scope=bot">
      Add to Discord
    </a>

  </div>
</nav>

<header class="page-header">
  <div class="eyebrow">BEACON PARTNERS</div>

  <h1>Our Partners</h1>

  <p>
    Meet the communities and projects working alongside Beacon Bot.
  </p>
</header>

<section class="partners-grid">

  <div class="partner-card">

    <img
      src="https://media.discordapp.net/attachments/1411544015060336717/1430200556994953357/75720a3c78e759938c73566c2f577a49.png?ex=69056fd0&is=69041e50&hm=8fccaf5448f4b673f9aca90d792a45793f0d75bd1148588aae37589fe5ab0f7f&=&format=webp&quality=lossless"
      alt="LunaBot"
    >

    <h3 class="verified">
      <i class="fa-solid fa-circle-check"></i>
      N/A
    </h3>

    <p>N/A</p>

    <a href="N/A" target="_blank">
      <i class="fa-brands fa-discord"></i>
      Join Server
    </a>

    <a href="N/A" target="_blank">
      <i class="fa-solid fa-globe"></i>
      Website
    </a>

  </div>

</section>

<footer>
  <p>© 2026 Beacon Bot — Partnering for the future of Discord communities.</p>
</footer>

</body>
</html>
